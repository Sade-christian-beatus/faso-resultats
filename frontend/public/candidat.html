<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Faso Résultats — Mon espace candidat</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .barre-drapeau {
    height: 4px;
    background: linear-gradient(90deg, #009e49 0%, #009e49 33%, #fcd116 33%, #fcd116 66%, #ef3340 66%, #ef3340 100%);
  }
  .carte-candidature { animation: apparition 0.25s ease-out; }
  @keyframes apparition {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  /* Filet de sécurité si le CDN Tailwind est lent/indisponible (3G) : sans lui,
     .hidden ne masquerait rien et toutes les sections/étapes s'afficheraient
     en même temps. */
  .hidden { display: none !important; }
</style>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div class="barre-drapeau"></div>

  <div class="max-w-xl mx-auto px-4 py-10">
    <header class="text-center mb-8 relative">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-700 text-white mb-3 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-emerald-800 tracking-tight">Mon espace candidat</h1>
      <p class="text-slate-600 mt-1.5 text-[15px]">
        Retrouvez tous vos résultats, toutes administrations confondues.
      </p>
      <button
        id="btn-deconnexion"
        type="button"
        class="hidden absolute right-0 top-0 text-xs text-slate-400 hover:text-slate-700 underline underline-offset-2"
      >
        Se déconnecter
      </button>
    </header>

    <!-- ===== Authentification ===== -->
    <section id="section-auth" class="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
      <div class="flex gap-2 mb-5" role="tablist">
        <button
          type="button"
          id="onglet-connexion"
          class="flex-1 text-sm font-medium rounded-lg px-3 py-2 bg-emerald-700 text-white transition"
        >Se connecter</button>
        <button
          type="button"
          id="onglet-inscription"
          class="flex-1 text-sm font-medium rounded-lg px-3 py-2 bg-slate-100 text-slate-600 transition"
        >Créer mon espace</button>
      </div>

      <div id="message-auth" class="mb-4"></div>

      <!-- Connexion -->
      <form id="form-connexion" class="space-y-4">
        <div>
          <label for="connexion-telephone" class="block text-sm font-medium text-slate-700 mb-1">
            Numéro de téléphone
          </label>
          <input
            id="connexion-telephone" type="tel" required placeholder="Ex : +22670000000"
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition"
          />
        </div>
        <button type="submit" class="w-full bg-emerald-700 text-white font-medium rounded-lg px-4 py-2.5 hover:bg-emerald-800 active:bg-emerald-900 transition shadow-sm">
          Recevoir un code par SMS
        </button>
      </form>

      <!-- Inscription -->
      <form id="form-inscription" class="hidden space-y-4">
        <div>
          <label for="inscription-cnib" class="block text-sm font-medium text-slate-700 mb-1">Numéro CNIB</label>
          <input id="inscription-cnib" type="text" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" />
        </div>
        <div>
          <label for="inscription-nom" class="block text-sm font-medium text-slate-700 mb-1">Nom complet</label>
          <input id="inscription-nom" type="text" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" />
        </div>
        <div>
          <label for="inscription-naissance" class="block text-sm font-medium text-slate-700 mb-1">Date de naissance</label>
          <input id="inscription-naissance" type="date" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" />
        </div>
        <div>
          <label for="inscription-telephone" class="block text-sm font-medium text-slate-700 mb-1">Numéro de téléphone</label>
          <input id="inscription-telephone" type="tel" required placeholder="Ex : +22670000000"
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" />
        </div>
        <label class="flex items-start gap-2 text-sm text-slate-600">
          <input id="inscription-consentement" type="checkbox" required class="mt-0.5" />
          <span>J'accepte que Faso Résultats conserve mes données pour créer mon espace candidat et m'informer de mes résultats (voir notre politique de confidentialité).</span>
        </label>
        <button type="submit" class="w-full bg-emerald-700 text-white font-medium rounded-lg px-4 py-2.5 hover:bg-emerald-800 active:bg-emerald-900 transition shadow-sm">
          Créer mon espace
        </button>
      </form>

      <!-- Validation OTP -->
      <form id="form-otp" class="hidden space-y-4">
        <p class="text-sm text-slate-600">
          Un code à 6 chiffres a été envoyé par SMS au <span id="otp-telephone-affiche" class="font-medium"></span>.
        </p>
        <div>
          <label for="otp-code" class="block text-sm font-medium text-slate-700 mb-1">Code reçu</label>
          <input id="otp-code" type="text" inputmode="numeric" maxlength="6" required placeholder="000000"
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 tracking-[0.5em] text-center text-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" />
        </div>
        <button type="submit" class="w-full bg-emerald-700 text-white font-medium rounded-lg px-4 py-2.5 hover:bg-emerald-800 active:bg-emerald-900 transition shadow-sm">
          Valider
        </button>
      </form>
    </section>

    <!-- ===== Dashboard ===== -->
    <section id="section-dashboard" class="hidden space-y-5">
      <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
        <h2 class="font-semibold text-slate-800 mb-3">Ajouter une candidature</h2>
        <form id="form-ajout-candidature" class="space-y-3">
          <select id="ajout-examen" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
            <option value="">Chargement des examens…</option>
          </select>
          <input id="ajout-recepisse" type="text" required placeholder="Numéro de récépissé / PV"
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" />
          <button type="submit" class="w-full bg-emerald-700 text-white font-medium rounded-lg px-4 py-2.5 hover:bg-emerald-800 active:bg-emerald-900 transition shadow-sm">
            Ajouter
          </button>
        </form>
        <div id="message-ajout" class="mt-3"></div>
      </div>

      <div>
        <h2 class="font-semibold text-slate-800 mb-3 px-1">Mes candidatures</h2>
        <div id="zone-candidatures" class="space-y-3">
          <p class="text-sm text-slate-400 px-1">Chargement…</p>
        </div>
      </div>
    </section>

    <footer class="text-center text-xs text-slate-400 mt-8 space-y-1">
      <p>Plateforme officielle de consultation des résultats — Burkina Faso</p>
      <p class="text-slate-300">« La Patrie ou la Mort, nous Vaincrons »</p>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/candidat.js"></script>
</body>
