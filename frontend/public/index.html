<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Faso Résultats — Consultation</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Filet de sécurité si le CDN Tailwind est lent/indisponible (3G) : sans lui, les
     classes utilitaires ne s'appliquent pas mais le contenu reste lisible. -->
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .barre-drapeau {
    height: 4px;
    background: linear-gradient(90deg, #009e49 0%, #009e49 33%, #fcd116 33%, #fcd116 66%, #ef3340 66%, #ef3340 100%);
  }
  .carte-resultat { animation: apparition 0.25s ease-out; }
  @keyframes apparition {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div class="barre-drapeau"></div>

  <div class="max-w-xl mx-auto px-4 py-10">
    <header class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-700 text-white mb-3 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 12l2 2 4-4" />
          <path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-emerald-800 tracking-tight">Faso Résultats</h1>
      <p class="text-slate-600 mt-1.5 text-[15px]">
        Consultez les résultats des examens et concours du Burkina Faso.
      </p>
    </header>

    <section class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 mb-5">
      <h2 class="font-semibold text-slate-800 mb-3 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="w-4 h-4 text-emerald-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
        Examens et concours disponibles
      </h2>
      <div id="zone-examens-disponibles" class="space-y-4">
        <p class="text-sm text-slate-400">Chargement…</p>
      </div>
    </section>

    <main class="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
      <form id="form-recherche" class="space-y-4">
        <div>
          <label for="select-examen" class="block text-sm font-medium text-slate-700 mb-1">Examen</label>
          <select
            id="select-examen"
            required
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition"
          >
            <option value="">Chargement des examens…</option>
          </select>
        </div>

        <div>
          <label for="input-numero-pv" class="block text-sm font-medium text-slate-700 mb-1">
            Numéro de PV
          </label>
          <input
            id="input-numero-pv"
            type="text"
            required
            placeholder="Ex : 001234"
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition"
          />
        </div>

        <div>
          <label for="input-jury" class="block text-sm font-medium text-slate-700 mb-1">
            Jury / centre <span class="text-slate-400 font-normal">(optionnel)</span>
          </label>
          <input
            id="input-jury"
            type="text"
            placeholder="Ex : Ouagadougou 1"
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-emerald-700 text-white font-medium rounded-lg px-4 py-2.5 hover:bg-emerald-800 active:bg-emerald-900 transition shadow-sm"
        >
          Consulter
        </button>
      </form>

      <div id="zone-message" class="mt-6"></div>
      <div id="zone-resultats" class="mt-6 space-y-4"></div>
    </main>

    <footer class="text-center text-xs text-slate-400 mt-8 space-y-1">
      <p>Plateforme officielle de consultation des résultats — Burkina Faso</p>
      <p class="text-slate-300">« La Patrie ou la Mort, nous Vaincrons »</p>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/public.js"></script>
</body>
