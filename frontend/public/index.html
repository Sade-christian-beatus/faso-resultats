<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Faso Résultats — Consultation</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<meta name="theme-color" content="#007A3D" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/brand.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/theme.js"></script>
<style>
  .carte-resultat { animation: apparition 0.25s ease-out; }
  @keyframes apparition {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
<body class="bg-clair text-nuit min-h-screen">
  <div class="barre-drapeau"></div>

  <div class="max-w-xl mx-auto px-4 py-10">
    <header class="text-center mb-8">
      <img src="assets/logo-mark.svg" alt="" width="64" height="64" class="w-16 h-16 mx-auto mb-3 drop-shadow-sm" />
      <h1 class="logo-texte text-3xl">
        <span class="logo-faso">Faso</span><span class="logo-etoile" aria-hidden="true">★</span><br />
        <span class="logo-resultats">Résultats</span>
      </h1>
      <p class="slogan text-sm mt-2">Vos résultats en un clic</p>
      <p class="text-slate-600 mt-3 text-[15px]">
        Consultez les résultats des examens et concours du Burkina Faso.
      </p>
    </header>

    <section class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 mb-5">
      <h2 class="font-semibold text-slate-800 mb-3 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="w-4 h-4 text-faso-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
        Examens et concours disponibles
      </h2>
      <div id="zone-examens-disponibles" class="space-y-4">
        <p class="text-sm text-slate-400">Chargement…</p>
      </div>
    </section>

    <main class="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
      <form id="form-recherche" class="space-y-4">
        <div>
          <label for="select-examen" class="block text-sm font-medium text-slate-700 mb-1">Examen</label>
          <select
            id="select-examen"
            required
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-faso-500 focus:border-faso-500 transition"
          >
            <option value="">Chargement des examens…</option>
          </select>
        </div>

        <div>
          <label for="input-numero-pv" class="block text-sm font-medium text-slate-700 mb-1">
            Numéro de PV
          </label>
          <input
            id="input-numero-pv"
            type="text"
            required
            placeholder="Ex : 001234"
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-faso-500 focus:border-faso-500 transition"
          />
        </div>

        <div>
          <label for="input-jury" class="block text-sm font-medium text-slate-700 mb-1">
            Jury / centre <span class="text-slate-400 font-normal">(optionnel)</span>
          </label>
          <input
            id="input-jury"
            type="text"
            placeholder="Ex : Ouagadougou 1"
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-faso-500 focus:border-faso-500 transition"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-faso-700 text-white font-medium rounded-lg px-4 py-2.5 hover:bg-faso-800 active:bg-faso-900 transition shadow-sm"
        >
          Consulter
        </button>
      </form>

      <div id="zone-message" class="mt-6"></div>
      <div id="zone-resultats" class="mt-6 space-y-4"></div>
    </main>

    <footer class="text-center text-xs text-slate-400 mt-8 space-y-1">
      <p>Plateforme officielle de consultation des résultats — Burkina Faso</p>
      <p class="text-slate-300">« La Patrie ou la Mort, nous Vaincrons »</p>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/public.js"></script>
</body>
