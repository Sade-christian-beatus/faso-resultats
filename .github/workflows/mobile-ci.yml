name: Mobile CI

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

defaults:
  run:
    working-directory: mobile

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: "stable"
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage

  # Build APK non signé, pour vérifier que la compilation Android passe.
  # android/app/build.gradle sait signer un build release (jour 10), mais
  # seulement si android/key.properties existe (fichier jamais commité).
  # Aucun keystore de production ne l'a encore été à ce jour : ce job reste
  # donc un build debug tant que ce n'est pas fait. Procédure complète
  # (génération du keystore, secrets CI) : docs/RELEASE.md.
  build-apk-debug:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: "stable"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - run: flutter pub get
      - run: flutter build apk --debug

  # Release build (what `flutter build apk` produces by default): goes through R8
  # minification/shrinking, which the debug build above never exercises. Signed
  # with the debug key when android/key.properties is absent (see build.gradle).
  build-apk-release:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: "stable"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - run: flutter pub get
      - run: flutter build apk --release
