name: faso_resultats_mobile
description: "Faso Résultats — application mobile candidat."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Réseau
  dio: ^5.7.0
  dio_cache_interceptor: ^3.5.0
  connectivity_plus: ^6.1.1

  # Stockage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.4

  # Notifications (squelette client — jour 6, aucun backend FCM n'existe encore
  # côté API, voir docs/API.md § Notifications push)
  firebase_core: ^3.9.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # Formulaires
  formz: ^0.7.0

  # i18n
  intl: ^0.19.0

  # Utilitaires prévus par le prompt (phase 3 / fonctions transverses)
  qr_flutter: ^4.1.0
  share_plus: ^10.1.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  # Pas de mockito : son builder de génération de code entre en conflit de
  # version avec riverpod_generator (mockito >=5.5 exige build ^3.0.0,
  # riverpod_generator 2.x exige build ^2.0.0 — voir mobile/docs/ARCHITECTURE.md).
  # Les tests utilisent des implémentations factices écrites à la main contre
  # les interfaces de repository (peu nombreuses, pas besoin de génération).
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true

  generate: true
