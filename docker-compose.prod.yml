services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-faso_resultats}
      POSTGRES_USER: ${POSTGRES_USER:-faso}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire en production}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Pas de port publié vers l'hôte : seuls les autres conteneurs du réseau
    # docker interne atteignent la base (jamais depuis l'extérieur du serveur).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-faso} -d ${POSTGRES_DB:-faso_resultats}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.production
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Pas de --reload (dev uniquement) ; pas de bind-mount du code source,
    # seule l'image construite tourne. Pas de port publié : Caddy proxy
    # l'atteint via le réseau docker interne (backend:8000).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
    depends_on:
      - backend
    # Pas de port publié : Caddy proxy l'atteint via frontend:80.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DEMO_DOMAIN: "${DEMO_DOMAIN:?DEMO_DOMAIN est obligatoire, ex. demo.faso-resultats.votredomaine.bf}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:
