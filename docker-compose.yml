services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: faso_resultats
      POSTGRES_USER: faso
      POSTGRES_PASSWORD: faso_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faso -d faso_resultats"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # Pas de port publié vers l'hôte : le backend l'atteint via le réseau
    # docker interne (redis:6379, voir REDIS_URL dans .env). Décommenter la
    # ligne ci-dessous seulement pour du débogage avec redis-cli/RedisInsight
    # depuis la machine hôte.
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # The image runs as a non-root user in production; in development the source is
    # mounted from the host and existing volumes may belong to root.
    user: root

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
      # Same nginx rules as production (deploy/nginx): /api is forwarded to the
      # backend, so the pages call the API on their own origin.
      - ./deploy/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
