# Development (docker-compose.yml): same layout as production, plain HTTP, no HSTS.
# The web pages call the API on their own origin (/api), so the site also works when
# opened from a phone on the same Wi-Fi (http://<PC IP>:8080).

upstream backend_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/api.conf;
    include /etc/nginx/snippets/static.conf;
}
