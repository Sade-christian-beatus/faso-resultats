# Static web pages (frontend/public). No add_header in these locations: in nginx an
# add_header inside a location silently drops every add_header of the server block
# (security headers). Caching only uses "expires".
root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

location / {
    try_files $uri $uri/ =404;
    # HTML: always revalidated, so a new version is seen at once.
    expires -1;
}

# CSS and JS: file names are not versioned, so a short cache (a deploy is visible
# within the hour; revalidation is cheap thanks to ETag).
location ~* \.(?:css|js)$ {
    expires 1h;
}

# Web app manifest ("Ajouter à l'écran d'accueil"): unknown to nginx's default MIME map.
location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    expires 1d;
}

# Fonts and images change very rarely: long cache, precious on 3G.
location ~* \.(?:woff2|webp|png|svg|ico)$ {
    expires 30d;
}
