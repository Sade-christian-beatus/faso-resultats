# Requests to the API, forwarded to the FastAPI backend (docker service "backend").
location /api/ {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwritten, never appended: a client-supplied X-Forwarded-For must not reach the
    # backend, which uses this value as the visitor's IP for rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Official result files (backend MAX_UPLOAD_SIZE_MB = 20, plus multipart overhead).
    client_max_body_size 25m;
    # OCR of a scanned PDF can take a while.
    proxy_read_timeout 180s;
}

location = /health {
    proxy_pass http://backend_api;
    proxy_set_header Host $host;
}
